# SQL Server's own settings (ADR 0033), installed into the data volume by the sqlserver-tls job in docker-compose.yml.
# Every connection is encrypted with the certificate issued by the development CA (scripts/dev-certs.sh); clients
# validate it instead of trusting whatever the server presents.
[network]
tlscert = /var/opt/mssql/tls/mssql.crt
tlskey = /var/opt/mssql/tls/mssql.key
forceencryption = 1
