# WSO2 Identity Server configuration for RegReturns (ADR 0014).
# Every secret is an environment variable; the defaults shipped with WSO2 (admin/admin, the wso2carbon
# keystores, the internal encryption key and the auth-endpoint password) are all replaced.

[server]
hostname = "$env{WSO2_HOSTNAME}"
node_ip = "127.0.0.1"
base_path = "https://$ref{server.hostname}:${carbon.management.port}"

[super_admin]
username = "$env{WSO2_ADMIN_USERNAME}"
password = "$env{WSO2_ADMIN_PASSWORD}"
create_admin_account = true

[user_store]
type = "database_unique_id"

# SQL Server collations are case-insensitive already (WSO2 guidance for MS SQL).
[user_store.properties]
CaseInsensitiveUsername = false
UseCaseSensitiveUsernameForCacheKeys = false
StoreUserAttributeValueAsUnicode = true

# Database TLS: encrypted, but the SQL Server container's self-signed certificate is not validated yet.
# Giving SQL Server a CA-issued certificate is tracked for the security hardening phase.
[database.identity_db]
type = "mssql"
url = "jdbc:sqlserver://$env{WSO2_DB_HOST}:1433;databaseName=WSO2_IDENTITY_DB;encrypt=true;trustServerCertificate=true;SendStringParametersAsUnicode=false;loginTimeout=10;socketTimeout=60000"
username = "$env{WSO2_DB_USERNAME}"
password = "$env{WSO2_DB_PASSWORD}"
driver = "com.microsoft.sqlserver.jdbc.SQLServerDriver"

[database.shared_db]
type = "mssql"
url = "jdbc:sqlserver://$env{WSO2_DB_HOST}:1433;databaseName=WSO2_SHARED_DB;encrypt=true;trustServerCertificate=true;SendStringParametersAsUnicode=false;loginTimeout=10;socketTimeout=60000"
username = "$env{WSO2_DB_USERNAME}"
password = "$env{WSO2_DB_PASSWORD}"
driver = "com.microsoft.sqlserver.jdbc.SQLServerDriver"

[datasource.AgentIdentity]
id = "AgentIdentity"
url = "jdbc:sqlserver://$env{WSO2_DB_HOST}:1433;databaseName=WSO2_AGENT_DB;encrypt=true;trustServerCertificate=true;SendStringParametersAsUnicode=false;loginTimeout=10;socketTimeout=60000"
username = "$env{WSO2_DB_USERNAME}"
password = "$env{WSO2_DB_PASSWORD}"
driver = "com.microsoft.sqlserver.jdbc.SQLServerDriver"

# Keystores generated by scripts/dev-certs.sh and mounted through the WSO2 config volume.
# Primary: signs tokens. TLS: the HTTPS certificate issued by the RegReturns development CA.
[keystore.primary]
file_name = "regreturns-primary.p12"
type = "PKCS12"
alias = "regreturns-signing"
password = "$env{WSO2_KEYSTORE_PASSWORD}"
key_password = "$env{WSO2_KEYSTORE_PASSWORD}"

[keystore.tls]
file_name = "regreturns-tls.p12"
type = "PKCS12"
alias = "regreturns-tls"
password = "$env{WSO2_KEYSTORE_PASSWORD}"
key_password = "$env{WSO2_KEYSTORE_PASSWORD}"

[truststore]
file_name = "regreturns-truststore.p12"
type = "PKCS12"
password = "$env{WSO2_KEYSTORE_PASSWORD}"

[encryption]
key = "$env{WSO2_ENCRYPTION_KEY}"

# Password the authentication endpoints use to call back into the server; the hash is its SHA-256.
[identity.auth_framework.endpoint]
app_password = "$env{WSO2_AUTH_ENDPOINT_PASSWORD}"

[account_recovery.endpoint.auth]
hash = "$env{WSO2_AUTH_ENDPOINT_PASSWORD_SHA256}"
