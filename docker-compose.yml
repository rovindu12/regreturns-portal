# Local development dependencies. Run the apps with `dotnet run` against these services.
# Phase 2 adds WSO2 Identity Server; phase 11 adds the app containers and Caddy.
name: regreturns

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  seq:
    # Log and trace viewer. Receives OTLP at http://localhost:5341/ingest/otlp; UI at http://localhost:8081.
    image: datalust/seq:2026.1
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "127.0.0.1:5341:5341"
      - "127.0.0.1:8081:80"
    volumes:
      - seq-data:/data

volumes:
  sqlserver-data:
  seq-data:
