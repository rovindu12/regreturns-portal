version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      opentelemetry:
        patterns: ["OpenTelemetry*"]
      serilog:
        patterns: ["Serilog*"]
      testing:
        patterns: ["xunit*", "NSubstitute*", "Shouldly", "Testcontainers*", "NetArchTest*"]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"

  # Base images in the Dockerfiles. The .NET images move together; keep the SQL Server, Caddy and WSO2 pins in step
  # with the compose files, the test fixture and the scripts (ImagePinTests fails when they drift).
  - package-ecosystem: docker
    directories: ["/", "/deploy/wso2", "/deploy/wso2/db-init"]
    schedule:
      interval: weekly
    groups:
      dotnet-images:
        patterns: ["*dotnet*"]
    commit-message:
      prefix: "build(deps)"
