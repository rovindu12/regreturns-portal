name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore (locked)
        run: dotnet restore RegReturns.slnx --locked-mode

      - name: Check formatting
        run: dotnet format RegReturns.slnx --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build RegReturns.slnx --configuration Release --no-restore

      - name: Unit tests with coverage
        run: >
          dotnet test --project tests/RegReturns.UnitTests --configuration Release --no-build
          --coverage --coverage-output-format cobertura --coverage-output unit.cobertura.xml
          --coverage-settings coverage.config --results-directory "${{ github.workspace }}/TestResults"

      - name: Coverage gate
        run: >
          python3 scripts/check-coverage.py
          TestResults/unit.cobertura.xml
          RegReturns.Domain=80

      - name: Integration tests (SQL Server in Testcontainers)
        run: dotnet test --project tests/RegReturns.IntegrationTests --configuration Release --no-build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: TestResults/unit.cobertura.xml
          if-no-files-found: ignore

  dependency-check:
    name: Vulnerable packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RegReturns.slnx --locked-mode

      - name: Fail on high or critical vulnerabilities
        run: |
          dotnet list RegReturns.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -qE '\b(High|Critical)\b' vulnerable.txt; then
            echo "::error::High or critical vulnerabilities found in NuGet dependencies"
            exit 1
          fi

  edge-check:
    name: Edge proxy (Caddy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Validates deploy/caddy/Caddyfile and runs it against stub upstreams: allowlist, sign-in paths, HSTS, redaction.
      - name: Check the Caddyfile
        run: scripts/check-caddy.sh

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every relative link, image and #anchor in the Markdown resolves, and every ADR is in the index (ADR 0035).
      - name: Check the documentation's links
        run: python3 scripts/check-docs.py

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Every commit, not only the change: a secret removed later is still in the history. Rules: .gitleaks.toml.
      - name: Scan the history
        env:
          GITLEAKS_IMAGE: zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "${PWD}:/repo:ro" "${GITLEAKS_IMAGE}"
          git --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1 /repo

  scripts:
    name: Shell scripts (ShellCheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck
        env:
          SHELLCHECK_IMAGE: koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb
        run: >
          docker run --rm -v "${PWD}:/mnt:ro" -w /mnt "${SHELLCHECK_IMAGE}" --severity=warning --external-sources
          scripts/*.sh deploy/*.sh deploy/sqlserver/*.sh deploy/wso2/db-init/*.sh
